name: iOS simulator validation
on:
  push:
    branches: ['verify/ios-1.1.34']
    paths:
      - '.github/workflows/ios-validation.yml'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'android/app/build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private || (github.repository == 'GodIceman/zhiwu' && github.ref == 'refs/heads/verify/ios-1.1.34')
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FAMILY: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Select simulator
        run: |
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun simctl list devices available --json > artifacts/devices.json
          python3 - "$(xcrun --sdk iphonesimulator --show-sdk-version)" <<'PY'
          import json, os, sys
          with open('artifacts/devices.json') as f:
              runtimes = json.load(f)['devices']
          family = os.environ['FAMILY']
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-' + sys.argv[1].replace('.', '-')
          devices = runtimes.get(runtime, [])
          device = next((d for d in devices if d.get('isAvailable') and d['name'].startswith(family)), None)
          if not device:
              raise SystemExit(f'No available {family} for {runtime}')
          print(runtime, device['name'], device['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              print(f"DEVICE={device['udid']}", file=f)
          PY
      - name: Boot the selected simulator
        timeout-minutes: 8
        run: xcrun simctl bootstatus "$DEVICE" -b
      - name: Prepare app and UI test scheme
        run: |
          npm ci
          npm run ios:sync
          npm run ios:check
          ruby -rxcodeproj -e '' || gem install --user-install xcodeproj -v 1.27.0 --no-document
          ruby scripts/prepare-ios-ui-test.rb
      - name: Run records and file picker tests
        id: native_ui
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test -project ios/App/App.xcodeproj -scheme Validation \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/zhiwu-ios" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 \
            -resultBundlePath "$RUNNER_TEMP/validation.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/ui-test.log
      - name: Check documents saved in Files
        if: ${{ !cancelled() && (steps.native_ui.outcome == 'success' || steps.native_ui.outcome == 'failure') }}
        run: |
          set -o pipefail
          python3 scripts/check-ios-exports.py artifacts/devices.json "$DEVICE" artifacts/ui-test.log 2>&1 | tee artifacts/export-check.txt
      - name: Collect test attachments
        if: always()
        timeout-minutes: 3
        run: |
          if [[ -d "$RUNNER_TEMP/validation.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/validation.xcresult" --output-path artifacts/attachments
          fi
      - name: Capture simulator screenshots
        if: ${{ always() && env.DEVICE != '' }}
        timeout-minutes: 8
        run: |
          set -eu
          xcrun simctl bootstatus "$DEVICE" -b
          if ! xcrun simctl get_app_container "$DEVICE" app.zhiwu.mobile app >/dev/null; then
            xcrun simctl install "$DEVICE" "$RUNNER_TEMP/zhiwu-ios/Build/Products/Debug-iphonesimulator/App.app"
          fi
          xcrun simctl launch "$DEVICE" app.zhiwu.mobile
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$appearance"
            sleep 5
            output="artifacts/$FAMILY-$appearance.png"
            xcrun simctl io "$DEVICE" screenshot "$output"
            test -s "$output"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.device }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1
